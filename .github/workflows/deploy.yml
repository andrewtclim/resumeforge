name: Deploy to Cloud Run

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          docker build \
            -t us-central1-docker.pkg.dev/job-tailor-499623/resumeforge/app:${{ github.sha }} \
            -t us-central1-docker.pkg.dev/job-tailor-499623/resumeforge/app:latest \
            .
          docker push us-central1-docker.pkg.dev/job-tailor-499623/resumeforge/app:${{ github.sha }}
          docker push us-central1-docker.pkg.dev/job-tailor-499623/resumeforge/app:latest

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: resumeforge
          region: us-central1
          image: us-central1-docker.pkg.dev/job-tailor-499623/resumeforge/app:${{ github.sha }}
